[workspace]
members = ["crates/*"]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/Wazza0/mcp-runtime-authz"

[workspace.dependencies]
rmcp = "3.9"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "io-std", "process", "fs", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
schemars = "1"

# Hardening: an overflow panics instead of wrapping silently.
[profile.release]
overflow-checks = true
