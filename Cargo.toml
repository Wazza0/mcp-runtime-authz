[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Wazza0/mcp-runtime-authz"

[workspace.dependencies]
rmcp = "3.9"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "io-std", "process", "fs", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.0"
schemars = "1"
