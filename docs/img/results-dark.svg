<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 206" width="880" height="206" role="img" aria-label="Results: attacks blocked 100% (7 of 7 scripted, 3 of 3 qwen3); benign tasks broken 0% (0 of 6 in every run); approval prompts on benign tasks 0; bypasses found and fixed 6, each pinned by a test. Small, self-written corpus: a demonstration, not proof of generality. If a human approves every prompt, the block rate drops to 86% scripted and 67% qwen3.">
  <style>
    .f { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .tile { fill: #1a1a19; stroke: rgba(255,255,255,0.10); }
    .t1 { fill: #f0efec; } .t2 { fill: #c3c2b7; }
  </style>
  <rect x="0.5" y="0.5" width="207" height="143" rx="12" class="tile"/>
  <text x="20" y="34" class="f t2" font-size="13">Attacks blocked</text>
  <text x="20" y="88" class="f t1" font-size="40" font-weight="600">100%</text>
  <text x="20" y="118" class="f t2" font-size="12.5">7/7 scripted · 3/3 qwen3</text>

  <rect x="224.5" y="0.5" width="207" height="143" rx="12" class="tile"/>
  <text x="244" y="34" class="f t2" font-size="13">Benign tasks broken</text>
  <text x="244" y="88" class="f t1" font-size="40" font-weight="600">0%</text>
  <text x="244" y="118" class="f t2" font-size="12.5">0 of 6, in every run</text>

  <rect x="448.5" y="0.5" width="207" height="143" rx="12" class="tile"/>
  <text x="468" y="34" class="f t2" font-size="13">Prompts on benign tasks</text>
  <text x="468" y="88" class="f t1" font-size="40" font-weight="600">0</text>
  <text x="468" y="118" class="f t2" font-size="12.5">quiet when it's safe</text>

  <rect x="672.5" y="0.5" width="207" height="143" rx="12" class="tile"/>
  <text x="692" y="34" class="f t2" font-size="13">Bypasses found, fixed</text>
  <text x="692" y="88" class="f t1" font-size="40" font-weight="600">6</text>
  <text x="692" y="118" class="f t2" font-size="12.5">each pinned by a test</text>

  <text x="2" y="174" class="f t2" font-size="13">Small, self-written corpus (7 attacks, 6 benign tasks): a demonstration, not proof of generality.</text>
  <text x="2" y="196" class="f t2" font-size="13">If a human approves every prompt, the block rate drops to 86% (scripted) and 67% (qwen3).</text>
</svg>
