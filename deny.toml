# Dependency policy, enforced in CI (`cargo deny --locked check`).

[advisories]
# Any RustSec vulnerability fails the build; yanked crates too.
yanked = "deny"

[licenses]
# Permissive licenses only, so the project stays usable under MIT OR Apache-2.0.
# Kept to exactly what the tree uses; a new license needs a deliberate edit here.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
