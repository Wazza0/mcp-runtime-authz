name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Reproduce the evaluation (scripted agent)
        run: |
          cargo run --release --locked -p authz-cli --bin authz -- eval --ablation | tee eval.md
          cat eval.md >> "$GITHUB_STEP_SUMMARY"
