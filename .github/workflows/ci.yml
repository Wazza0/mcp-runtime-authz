name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Reproduce the evaluation (scripted agent)
        run: |
          cargo run --release --locked -p authz-cli --bin authz -- eval --ablation | tee eval.md
          cat eval.md >> "$GITHUB_STEP_SUMMARY"

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with: { tool: cargo-llvm-cov }
      - name: Run the test suite instrumented
        run: cargo llvm-cov --workspace --locked --no-report
      - name: Line coverage (fails under 80%)
        shell: bash
        run: |
          cargo llvm-cov report --summary-only --fail-under-lines 80 | tee cov.txt
          { echo '## Test coverage'; echo; echo '```'; cat cov.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Build the release binary twice from clean; the two must be bit-for-bit identical
        run: |
          for i in 1 2; do
            cargo clean
            cargo build --release --locked -p authz-cli --bin authz
            sha256sum target/release/authz | tee "build$i.sha256"
          done
          [ "$(cut -d' ' -f1 build1.sha256)" = "$(cut -d' ' -f1 build2.sha256)" ]
          echo "Reproducible: \`$(cut -d' ' -f1 build1.sha256)\`" >> "$GITHUB_STEP_SUMMARY"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Build the image
        run: docker build -t authz .
      - name: The container starts and lists its tools over MCP
        run: |
          {
            echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2026-07-28","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
            echo '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            echo '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
            sleep 5
          } | timeout 30 docker run -i --rm authz | tee out.jsonl
          grep '"id":2' out.jsonl | grep -q '"fs_read"'

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with: { tool: cargo-deny }
      - name: Advisories, licenses, banned and unknown sources
        run: cargo deny --locked check

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Nightly toolchain (libFuzzer needs it)
        run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with: { tool: cargo-fuzz }
      # The prebuilt cargo-fuzz is a musl binary and would default to fuzzing for musl.
      - name: Fuzz the decoder, the policy loader and the decision path (60s each)
        run: |
          for t in decode policy decide; do
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$t" -- -max_total_time=60
          done
