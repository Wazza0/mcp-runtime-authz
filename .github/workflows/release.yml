name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --release --locked -p authz-cli --bin authz
      - name: Package
        shell: bash
        run: |
          name="authz-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md SECURITY.md LICENSE-MIT LICENSE-APACHE "$name"/
          cp -r policies "$name"/
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/authz.exe "$name"/
            7z a "$name.zip" "$name" > /dev/null
            asset="$name.zip"
          else
            cp target/release/authz "$name"/
            tar czf "$name.tar.gz" "$name"
            asset="$name.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then sha256sum "$asset" > "$asset.sha256"
          else shasum -a 256 "$asset" > "$asset.sha256"; fi
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
