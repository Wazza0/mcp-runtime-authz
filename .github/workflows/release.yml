name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write      # attach assets to the release
      id-token: write      # sign build provenance
      attestations: write
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --release --locked -p authz-cli --bin authz
      - name: Package
        shell: bash
        run: |
          name="authz-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md SECURITY.md LICENSE-MIT LICENSE-APACHE "$name"/
          cp -r policies "$name"/
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/authz.exe "$name"/
            7z a "$name.zip" "$name" > /dev/null
            asset="$name.zip"
          else
            cp target/release/authz "$name"/
            tar czf "$name.tar.gz" "$name"
            asset="$name.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then sha256sum "$asset" > "$asset.sha256"
          else shasum -a 256 "$asset" > "$asset.sha256"; fi
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - name: Sign build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}
      # Also ship the signed bundle as a release asset, so it can be verified offline and
      # tools that look for signatures next to the download (e.g. OpenSSF Scorecard) find it.
      - name: Attach provenance bundle
        shell: bash
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "$ASSET.sigstore.json"
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
            ${{ env.ASSET }}.sigstore.json
